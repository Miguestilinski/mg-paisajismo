<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos MG Paisajismo</title>
    <link href="./styles/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    
    <div id="app" class="min-h-screen text-gray-800 font-sans bg-cover bg-center bg-fixed" style="background-image: url('./assets/fondo-1.jpg');">
        
        <!-- Overlay de cristal para legibilidad -->
        <div class="min-h-screen bg-black/10 backdrop-blur-sm py-12 px-6">
            <div class="max-w-5xl mx-auto bg-white/85 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/40 print:hidden">
                <header class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-6">
                        <img src="./assets/Logo MG Paisajismo.png" alt="MG Paisajismo" class="h-20 object-contain">
                        <div>
                            <h1 class="text-4xl font-bold text-zinc-900 tracking-tight">Hola, Moni</h1>
                            <p class="text-zinc-600 text-lg mt-1 font-medium">Tus presupuestos recientes.</p>
                        </div>
                    </div>
                    <button id="btn-nuevo-presupuesto" class="bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition-all hover:shadow-xl hover:-translate-y-0.5 flex items-center gap-2 text-lg">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                        Nuevo Presupuesto
                    </button>
                </header>

                <div class="bg-white/90 rounded-xl shadow-sm border border-zinc-200/50 overflow-hidden">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-zinc-100/80 text-zinc-600 uppercase text-xs font-bold tracking-wider">
                                <th class="p-5 border-b border-zinc-200">Fecha</th>
                                <th class="p-5 border-b border-zinc-200">Proyecto / Constructora</th>
                                <th class="p-5 border-b border-zinc-200">Total Neto</th>
                                <th class="p-5 border-b border-zinc-200 text-right">Acción</th>
                            </tr>
                        </thead>
                        <tbody id="lista-presupuestos">
                            <!-- Los presupuestos se cargarán dinámicamente desde app.js -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Carga de Dexie.js desde CDN -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <!-- Carga modular de JS -->
    <script type="module" src="./scripts/firebase-config.js"></script>
    <script type="module" src="./scripts/versions.js"></script>
    <script type="module" src="./scripts/db.js"></script>
    <script type="module" src="./scripts/app.js"></script>
</body>
</html>
