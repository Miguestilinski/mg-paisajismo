<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presupuestos MG Paisajismo</title>
    <link href="./styles/output.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    
    <div id="app" class="min-h-screen text-gray-800 font-sans bg-cover bg-center bg-fixed" style="background-image: url('./assets/fondo-1.jpg');">
        
        <!-- Overlay de cristal para legibilidad -->
        <div class="min-h-screen bg-black/10 backdrop-blur-sm py-12 px-6">
            <div class="max-w-5xl mx-auto bg-white/85 backdrop-blur-md rounded-2xl shadow-2xl p-8 border border-white/40 print:hidden">
                <header class="flex justify-between items-center mb-10">
                    <div class="flex items-center gap-6">
                        <img src="./assets/Logo MG Paisajismo.png" alt="MG Paisajismo" class="h-20 object-contain">
                        <div>
                            <h1 class="text-4xl font-bold text-zinc-900 tracking-tight">Hola, Mónica</h1>
                            <p class="text-zinc-600 text-lg mt-1 font-medium">Tus presupuestos recientes.</p>
                        </div>
                    </div>
                    <div class="flex items-center gap-3">
                        <button id="btn-toggle-edicion-global" class="bg-white hover:bg-zinc-50 text-zinc-600 font-semibold py-3 px-4 rounded-xl shadow-sm border border-zinc-200 transition-all flex items-center gap-2 text-sm">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
                            Editar Lista
                        </button>
                        <button id="btn-nuevo-presupuesto" class="bg-zinc-900 hover:bg-zinc-800 text-white font-semibold py-3 px-6 rounded-xl shadow-lg transition-all hover:shadow-xl hover:-translate-y-0.5 flex items-center gap-2 text-lg">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            Nuevo Presupuesto
                        </button>
                    </div>
                </header>

                <div class="bg-white/90 rounded-xl shadow-sm border border-zinc-200/50 overflow-hidden flex flex-col">
                    
                    <!-- Barra de Filtros -->
                    <div class="p-4 border-b border-zinc-200/80 bg-zinc-50/50 flex gap-4 items-center">
                        <div class="relative flex-1">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="w-5 h-5 text-zinc-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                            </div>
                            <input type="text" id="filtro-texto" class="block w-full pl-10 pr-3 py-2 border border-zinc-300 rounded-lg leading-5 bg-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 sm:text-sm transition-colors" placeholder="Buscar por proyecto o constructora...">
                        </div>
                        <div class="w-64 relative">
                            <!-- El input de fecha será manejado por Flatpickr -->
                            <input type="text" id="filtro-fecha" class="block w-full px-3 py-2 border border-zinc-300 rounded-lg leading-5 bg-white placeholder-zinc-400 focus:outline-none focus:ring-1 focus:ring-zinc-900 focus:border-zinc-900 sm:text-sm transition-colors cursor-pointer" placeholder="Filtrar por fecha...">
                            <button id="btn-limpiar-fecha" class="absolute inset-y-0 right-0 pr-3 flex items-center text-zinc-400 hover:text-red-500 hidden transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                            </button>
                        </div>
                    </div>

                    <!-- Tabla Contenedor Scrollable -->
                    <div class="overflow-y-auto max-h-[500px]">
                        <table class="w-full text-left border-collapse relative">
                            <thead class="sticky top-0 bg-zinc-100/95 backdrop-blur-sm z-10 shadow-sm text-zinc-600 uppercase text-xs font-bold tracking-wider">
                                <tr>
                                    <th class="p-5 border-b border-zinc-200">Fecha</th>
                                    <th class="p-5 border-b border-zinc-200">Proyecto / Constructora</th>
                                    <th class="p-5 border-b border-zinc-200">Total Neto</th>
                                    <th class="p-5 border-b border-zinc-200 text-right">Acción</th>
                                </tr>
                            </thead>
                            <tbody id="lista-presupuestos" class="bg-white">
                                <!-- Los presupuestos se cargarán dinámicamente desde app.js -->
                            </tbody>
                        </table>
                    </div>
                    
                    <!-- Footer Info -->
                    <div class="p-3 border-t border-zinc-200 bg-zinc-50/80 text-xs text-zinc-500 font-medium px-5">
                        <span id="contador-resultados">Mostrando 0 resultados</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- ================= MODALES CUSTOM ================= -->
    <!-- Modal Confirmación -->
    <div id="modal-confirm" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-zinc-900/40 backdrop-blur-sm print:hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white/95 backdrop-blur-md border border-white/50 shadow-2xl rounded-2xl p-6 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-200" id="modal-confirm-box">
            <h3 class="text-lg font-bold text-zinc-900 mb-2" id="modal-confirm-title">Confirmar</h3>
            <p class="text-zinc-600 mb-6 text-sm" id="modal-confirm-message">¿Estás seguro de continuar?</p>
            <div class="flex justify-end gap-3">
                <button id="btn-modal-confirm-cancel" class="px-4 py-2 rounded-lg font-medium text-zinc-600 hover:bg-zinc-100 transition-colors">Cancelar</button>
                <button id="btn-modal-confirm-ok" class="px-4 py-2 rounded-lg font-bold text-white bg-red-500 hover:bg-red-600 transition-colors shadow-sm">Sí, eliminar</button>
            </div>
        </div>
    </div>

    <!-- Modal Prompt -->
    <div id="modal-prompt" class="fixed inset-0 z-50 flex items-center justify-center hidden bg-zinc-900/40 backdrop-blur-sm print:hidden opacity-0 transition-opacity duration-200">
        <div class="bg-white/95 backdrop-blur-md border border-white/50 shadow-2xl rounded-2xl p-6 max-w-md w-full mx-4 transform scale-95 transition-transform duration-200" id="modal-prompt-box">
            <h3 class="text-lg font-bold text-zinc-900 mb-2" id="modal-prompt-title">Título</h3>
            <p class="text-zinc-600 mb-4 text-sm" id="modal-prompt-message">Mensaje</p>
            <input type="text" id="modal-prompt-input" class="w-full border border-zinc-300 bg-zinc-50 focus:bg-white focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900 rounded-lg p-2.5 mb-6 text-sm transition-colors">
            <div class="flex justify-end gap-3">
                <button id="btn-modal-prompt-cancel" class="px-4 py-2 rounded-lg font-medium text-zinc-600 hover:bg-zinc-100 transition-colors">Cancelar</button>
                <button id="btn-modal-prompt-ok" class="px-4 py-2 rounded-lg font-bold text-white bg-zinc-900 hover:bg-zinc-800 transition-colors shadow-sm">Guardar</button>
            </div>
        </div>
    </div>

    <!-- Carga de Dexie.js desde CDN -->
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>

    <!-- Carga modular de JS -->
    <script type="module" src="./scripts/firebase-config.js"></script>
    <script type="module" src="./scripts/versions.js"></script>
    <script type="module" src="./scripts/db.js"></script>
    <script type="module" src="./scripts/app.js"></script>
</body>
</html>
